<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      // 요청된 URL에서 경로 부분만 가져옵니다.
      var path = window.location.pathname;

      // 서브디렉토리 경로가 있다면 해당 경로를 유지하며 리디렉션합니다.
      if (path.startsWith('/sleact')) {
        window.location.replace('/sleact' + '/#' + path.slice('/sleact'.length));
      } else {
        // 서브디렉토리 없이 루트 경로에서 바로 시작하는 경우
        window.location.replace(window.location.protocol + '//' + window.location.host + '/#/' + path);
      }
    </script>
  </head>
  <body></body>
</html>
